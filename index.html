<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timecard</title>
<style>
:root{--bg:#f5f6f8;--surface:#fff;--ink:#1c2630;--muted:#5d6b78;--line:#d9dee4;--blue:#2c5b8a;--green:#2b7a58;--red:#b0432f}
@media (prefers-color-scheme:dark){:root{--bg:#141a20;--surface:#1d252d;--ink:#e8edf2;--muted:#9aa8b5;--line:#2f3a45;--blue:#6ea3d6;--green:#5cc19a;--red:#e8806c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.05rem;margin:0 0 12px}
section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#0e1419}}
.clock{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.timer{font-size:2.4rem;font-variant-numeric:tabular-nums;font-weight:600;min-width:7ch}
.status{color:var(--muted)}
#clockBtn{padding:12px 28px;font-size:1.05rem;font-weight:600;color:#fff;background:var(--green);border-color:var(--green)}
#clockBtn.out{background:var(--red);border-color:var(--red)}
@media (prefers-color-scheme:dark){#clockBtn{color:#0e1419}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;align-items:end}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.85rem;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
tfoot td{font-weight:600;border-bottom:0}
.del{color:var(--red);border:0;background:none;padding:4px 8px}
.empty{color:var(--muted);padding:12px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar div{display:flex;gap:8px;align-items:center}
.bar span{min-width:12ch;text-align:center}
@media print{header button,.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<main>
<header>
  <h1>Timecard</h1>
  <div style="min-width:220px"><label for="emp">Employee name</label><input id="emp" placeholder="Full name" autocomplete="name"></div>
</header>

<section class="noprint">
  <h2>Clock</h2>
  <div class="clock">
    <div class="timer" id="timer">00:00:00</div>
    <button id="clockBtn">Clock in</button>
    <div class="status" id="status">Not clocked in</div>
  </div>
</section>

<section class="noprint">
  <h2>Add entry manually</h2>
  <div class="grid">
    <div><label for="mDate">Date</label><input type="date" id="mDate"></div>
    <div><label for="mIn">Start</label><input type="time" id="mIn"></div>
    <div><label for="mOut">End</label><input type="time" id="mOut"></div>
    <div><label for="mBreak">Break (min)</label><input type="number" id="mBreak" min="0" value="0"></div>
    <div><label for="mNote">Note</label><input id="mNote" placeholder="Optional"></div>
    <button id="addBtn" class="primary">Add entry</button>
  </div>
  <div class="status" id="err" style="color:var(--red);margin-top:8px" role="alert"></div>
</section>

<section>
  <div class="bar">
    <h2 style="margin:0">Weekly timesheet</h2>
    <div class="noprint">
      <button id="prev" aria-label="Previous week">&larr;</button>
      <span id="weekLabel"></span>
      <button id="next" aria-label="Next week">&rarr;</button>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Date</th><th>Start</th><th>End</th><th class="num">Break</th><th class="num">Hours</th><th>Note</th><th class="noprint"></th></tr></thead>
      <tbody id="rows"></tbody>
      <tfoot><tr><td colspan="4">Total</td><td class="num" id="total">0.00</td><td colspan="2"></td></tr></tfoot>
    </table>
  </div>
  <div class="noprint" style="display:flex;gap:8px;margin-top:16px">
    <button id="csv">Export CSV</button>
    <button id="print">Print</button>
  </div>
</section>
</main>

<script>
(function(){
  var KEY='timecard.v1';
  var state={entries:[],active:null,name:''};
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s)state=s}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var pad=function(n){return String(n).padStart(2,'0')};
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function hm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
  function hours(e){
    var a=new Date(e.date+'T'+e.start),b=new Date(e.date+'T'+e.end);
    var m=(b-a)/60000; if(m<0)m+=1440;
    return Math.max(0,(m-(e.brk||0))/60);
  }
  var weekStart=startOfWeek(new Date());
  function startOfWeek(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}

  $('emp').value=state.name||'';
  $('emp').addEventListener('input',function(){state.name=this.value;save()});
  $('mDate').value=ymd(new Date());

  // Clock
  function renderClock(){
    var btn=$('clockBtn');
    if(state.active){
      btn.textContent='Clock out';btn.className='out';
      var t=new Date(state.active);
      $('status').textContent='Clocked in at '+hm(t);
      var sec=Math.floor((Date.now()-t)/1000);
      $('timer').textContent=pad(Math.floor(sec/3600))+':'+pad(Math.floor(sec%3600/60))+':'+pad(sec%60);
    }else{
      btn.textContent='Clock in';btn.className='';
      $('status').textContent='Not clocked in';$('timer').textContent='00:00:00';
    }
  }
  $('clockBtn').addEventListener('click',function(){
    if(state.active){
      var a=new Date(state.active),b=new Date();
      state.entries.push({id:Date.now(),date:ymd(a),start:hm(a),end:hm(b),brk:0,note:''});
      state.active=null;
    }else{state.active=new Date().toISOString()}
    save();renderClock();renderTable();
  });
  setInterval(function(){if(state.active)renderClock()},1000);

  // Manual entry
  $('addBtn').addEventListener('click',function(){
    var d=$('mDate').value,s=$('mIn').value,e=$('mOut').value;
    if(!d||!s||!e){$('err').textContent='Enter a date, start time and end time.';return}
    $('err').textContent='';
    state.entries.push({id:Date.now(),date:d,start:s,end:e,brk:parseInt($('mBreak').value)||0,note:$('mNote').value.trim()});
    $('mNote').value='';$('mBreak').value=0;
    save();renderTable();
  });

  // Table
  function weekEntries(){
    var end=new Date(weekStart);end.setDate(end.getDate()+6);
    var a=ymd(weekStart),b=ymd(end);
    return state.entries.filter(function(e){return e.date>=a&&e.date<=b})
      .sort(function(x,y){return (x.date+x.start).localeCompare(y.date+y.start)});
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function renderTable(){
    var end=new Date(weekStart);end.setDate(end.getDate()+6);
    var f=function(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
    $('weekLabel').textContent=f(weekStart)+' – '+f(end);
    var list=weekEntries(),tot=0,html='';
    list.forEach(function(e){
      var h=hours(e);tot+=h;
      var d=new Date(e.date+'T00:00');
      html+='<tr><td>'+d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</td><td>'+e.start+'</td><td>'+e.end+'</td><td class="num">'+(e.brk||0)+' min</td><td class="num">'+h.toFixed(2)+'</td><td>'+esc(e.note||'')+'</td><td class="noprint"><button class="del" data-id="'+e.id+'" aria-label="Delete entry">Delete</button></td></tr>';
    });
    $('rows').innerHTML=html||'<tr><td colspan="7" class="empty">No entries this week. Clock in or add one above.</td></tr>';
    $('total').textContent=tot.toFixed(2);
  }
  $('rows').addEventListener('click',function(ev){
    var id=ev.target.getAttribute('data-id');if(!id)return;
    state.entries=state.entries.filter(function(e){return String(e.id)!==id});
    save();renderTable();
  });
  $('prev').addEventListener('click',function(){weekStart.setDate(weekStart.getDate()-7);renderTable()});
  $('next').addEventListener('click',function(){weekStart.setDate(weekStart.getDate()+7);renderTable()});

  // Export
  $('csv').addEventListener('click',function(){
    var rows=[['Employee','Date','Start','End','Break (min)','Hours','Note']];
    weekEntries().forEach(function(e){rows.push([state.name,e.date,e.start,e.end,e.brk||0,hours(e).toFixed(2),e.note||''])});
    var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    a.download='timecard-'+ymd(weekStart)+'.csv';a.click();
  });
  $('print').addEventListener('click',function(){window.print()});

  renderClock();renderTable();
})();
</script>
</body>
</html>
